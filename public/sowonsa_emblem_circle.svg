<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="emblemBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D241C"/>
      <stop offset="50%" stop-color="#1B1713"/>
      <stop offset="100%" stop-color="#100D0A"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3B8"/>
      <stop offset="30%" stop-color="#F5D061"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C630D"/>
    </linearGradient>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F5D061" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="236" fill="url(#emblemBg)"/>
  <circle cx="256" cy="256" r="236" stroke="url(#goldRing)" stroke-width="12"/>

  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="208" stroke="#F5D061" stroke-width="3" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- Golden 卍 Symbol -->
  <text x="256" y="280" font-family="'Batang', 'Noto Serif KR', serif" font-size="200" font-weight="900" fill="url(#goldRing)" text-anchor="middle" filter="url(#emblemGlow)">
    卍
  </text>

  <!-- Bottom Arch Label -->
  <text x="256" y="405" font-family="'Batang', 'Noto Serif KR', serif" font-size="44" font-weight="900" fill="#FFF3B8" text-anchor="middle" letter-spacing="4">
    제주 소원사
  </text>
  <text x="256" y="440" font-family="'Malgun Gothic', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#C59B27" text-anchor="middle" letter-spacing="8">
    JEJU SOWONSA
  </text>
</svg>
