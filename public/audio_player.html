<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>제주 소원사 법음 쉼터 음원 청취실</title>
  <style>
    body {
      background: #1B1815;
      color: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #25201A;
      border: 1px solid #C59B27;
      border-radius: 20px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      color: #F5D061;
      font-size: 20px;
      margin-top: 0;
      text-align: center;
    }
    .track {
      background: #191512;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #3D3328;
    }
    .track-title {
      font-size: 15px;
      font-weight: bold;
      color: #FFF3B8;
      margin-bottom: 6px;
    }
    .track-desc {
      font-size: 12px;
      color: #A89880;
      margin-bottom: 10px;
    }
    audio {
      width: 100%;
      height: 40px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎧 제주 소원사 법음 음원 청취실</h1>
    
    <div class="track">
      <div class="track-title">1. 반야심경 정통 독경 (2분 51초)</div>
      <div class="track-desc">현재 탑재된 원음 트랙 (영인스님 청아한 육성 & 목탁)</div>
      <audio controls src="/audio/prajna_chanting.mp3"></audio>
    </div>

    <div class="track">
      <div class="track-title">2. 천수경 정통 독경 (3분 20초)</div>
      <div class="track-desc">소원성취 다라니 & 목탁 리듬 트랙</div>
      <audio controls src="/audio/dhammapada_wisdom.mp3"></audio>
    </div>

    <div class="track">
      <div class="track-title">3. 광명진언 치유 독경 (2분 46초)</div>
      <div class="track-desc">나직한 자비 원음 & 맑은 치유 종송 트랙</div>
      <audio controls src="/audio/sleep_meditation.mp3"></audio>
    </div>

    <div class="track">
      <div class="track-title">4. 대웅전 정통 흑단목 목탁 (무한 반복)</div>
      <div class="track-desc">108배 및 좌선 명상용 청정 목탁 순수음</div>
      <audio controls src="/audio/muyeok_moktak.mp3"></audio>
    </div>
  </div>
</body>
</html>
